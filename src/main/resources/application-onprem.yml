# On-prem profile. Activated together with prod: SPRING_PROFILES_ACTIVE=prod,onprem
#
# Everything site-specific (DB credentials, hostname, API keys) comes from
# environment variables injected by deploy/onprem/docker-compose.yml.
# Nothing secret belongs in this file.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate

mosaic:
  oms:
    frontend:
      url: ${MOSAIC_OMS_FRONTEND_URL}

management:
  endpoint:
    health:
      probes:
        enabled: true
